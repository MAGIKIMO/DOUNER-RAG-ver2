name: donga-rag-v2
services:
  web:
    image: nginx:1.28-alpine
    ports: ["8080:80"]
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
  app:
    build: ./app
    env_file: .env
    environment:
      MYSQL_HOST: db
      CHROMA_HOST: vector-db
      HF_HOME: /cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
    expose: ["8000"]
    volumes:
      - model_cache:/cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      vector-db:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
  db:
    image: mysql:8.0.42
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-donga_rag}
      MYSQL_USER: ${MYSQL_USER:-donga}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=128M", "--max-connections=30"]
    expose: ["3306"]
    volumes: ["./data/mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  vector-db:
    image: chromadb/chroma:1.0.20
    expose: ["8000"]
    environment:
      CHROMA_PERSIST_PATH: /data
      ANONYMIZED_TELEMETRY: "False"
    volumes: ["./data/vector_data:/data"]
    restart: unless-stopped
volumes:
  model_cache:
