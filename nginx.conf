limit_req_zone $binary_remote_addr zone=ask:10m rate=10r/m;
log_format without_query '$remote_addr - $request_method $uri $status $body_bytes_sent';
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    access_log /var/log/nginx/access.log without_query;
    error_log /var/log/nginx/error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location / { try_files $uri $uri/ =404; }
    location = /sw.js { expires -1; try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; expires -1; try_files $uri =404; }
    # Authorization codes arrive in the query string. Do not log callback requests.
    location = /api/v1/canvas/callback {
        access_log off;
        error_log /dev/null crit;
        limit_req zone=ask burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
    location /api/ {
        limit_req zone=ask burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
